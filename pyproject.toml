[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-code-mode"
version = "0.1.0"
description = "Code mode for DaVinci Resolve — an agent drives Resolve by writing scripts against a live method catalog, not one tool per API method."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Poul Waligora / wildlion.media / FORGE." }]
keywords = ["davinci-resolve", "code-mode", "mcp", "agent", "video-editing",
            "post-production", "automation", "scripting"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video",
]
dependencies = []   # stdlib only — tomllib requires Python 3.11+ for the guard

[project.optional-dependencies]
mcp = ["mcp>=1.0"]   # only needed for the optional MCP front door (mcp_server/)

[project.scripts]
forge-resolve-doctor = "forge_resolve.doctor:main"

[project.urls]
Homepage = "https://github.com/USERNAME/forge-code-mode"
Source = "https://github.com/USERNAME/forge-code-mode"

[tool.setuptools]
packages = ["forge_resolve", "forge_resolve.examples", "mcp_server"]
